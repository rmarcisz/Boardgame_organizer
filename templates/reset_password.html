{% extends "base.html" %}
{% block title %}Nowe hasło – Zgrani 2026 - planszówkowy organizer{% endblock %}
{% block content %}
<div class="login-card">
    <h2>Ustaw nowe hasło</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        <input type="password" name="password" placeholder="Nowe hasło (min. 8 znaków)" autofocus required>
        <input type="password" name="confirm" placeholder="Powtórz hasło" required>
        <button type="submit">Zmień hasło</button>
    </form>
</div>
{% endblock %}
