{% extends "base.html" %}
{% block title %}Logowanie – Planszówki na wyjazd{% endblock %}
{% block content %}
<div class="login-card">
    <h2>Kto tu jest?</h2>
    <p class="muted">Wpisz swoje imię, aby dołączyć. Za pierwszym razem utworzy nowy profil; to samo imię zaloguje Cię ponownie.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        <input type="text" name="name" placeholder="Twoje imię" autofocus required>
        <button type="submit">Dalej</button>
    </form>
</div>
{% endblock %}
