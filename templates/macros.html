{% macro list_toolbar(region_id, default_sort='az') %}
<div class="list-toolbar" data-region="{{ region_id }}">
    <label class="toolbar-field">
        <span>Filtruj</span>
        <select class="filter-select">
            <option value="">Wszyscy</option>
        </select>
    </label>
    <label class="toolbar-field">
        <span>Sortuj</span>
        <select class="sort-select">
            <option value="az" {{ 'selected' if default_sort == 'az' else '' }}>A-Z</option>
            <option value="interest" {{ 'selected' if default_sort == 'interest' else '' }}>Liczba zainteresowanych</option>
        </select>
    </label>
</div>
{% endmacro %}

{% macro comment_thread(comments, data_id, add_action) %}
<details class="comments" data-id="{{ data_id }}">
    <summary class="comment-toggle">💬 {{ comments|length }}</summary>
    <div class="comment-list">
        {% for comment in comments %}
        <p class="comment">
            <span class="tag" style="background-color: {{ comment['author_name'] | name_color }};">{{ comment['author_name'] }}</span>
            {{ comment['text'] }}
        </p>
        {% else %}
        <p class="muted">Brak komentarzy.</p>
        {% endfor %}
        <form method="post" action="{{ add_action }}" class="inline-form ajax-form comment-form">
            <input type="text" name="text" placeholder="Napisz komentarz…" maxlength="255" required>
            <button type="submit">Dodaj</button>
        </form>
    </div>
</details>
{% endmacro %}
