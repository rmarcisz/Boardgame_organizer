{% extends "base.html" %}
{% block title %}Rejestracja – Zgrani 2026 - planszówkowy organizer{% endblock %}
{% block content %}
<div class="login-card">
    <h2>Zarejestruj się</h2>
    <p class="muted">Załóż konto z e-mailem i hasłem.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        <input type="text" name="name" value="{{ name or '' }}" placeholder="Twoje imię" maxlength="50" autofocus required>
        <input type="email" name="email" value="{{ email or '' }}" placeholder="Adres e-mail" maxlength="120" required>
        <input type="password" name="password" placeholder="Hasło (min. 8 znaków)" required>
        <input type="password" name="confirm" placeholder="Powtórz hasło" required>
        <button type="submit">Zarejestruj się</button>
    </form>
    <div class="login-links">
        <a href="{{ url_for('login') }}" class="link-btn">Masz już konto? Zaloguj się</a>
    </div>
</div>
{% endblock %}
